name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages (Graphviz, TeX Live with IEEEtran)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            graphviz texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-bibtex-extra texlive-fonts-recommended texlive-publishers latexmk

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate catalog and bibliography
        run: make validate

      - name: Regenerate tables, README and figures
        run: |
          make tables
          make readme
          make figures

      - name: Fail if generated content is stale
        run: |
          git status --porcelain
          git diff --exit-code -- README.md paper/tables docs/tables assets || \
            (echo "Generated files are stale. Run 'make tables readme figures' and commit." && exit 1)

      - name: Build IEEE PDF
        run: make paper

      - uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/main.pdf
