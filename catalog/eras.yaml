# Historical eras used as ONE dimension of the survey (see docs/taxonomy.md).
# Era membership follows publication year and these date ranges. Where a programming
# model spans two eras, the paper belongs to the era of its year; the era text says
# where a model began earlier or matured later.
# Date ranges are provisional and must be revised as evidence accumulates; the
# `boundary_evidence` field records which dated events justify the boundaries.
version: 0.1
eras:
  - id: era0
    name: "Foundations"
    start: 1950
    end: 1979
    machine_driver: "Stored-program machines, FORTRAN, pipelined vector processors, lock-step array processors, dataflow and systolic proposals"
    programming_abstraction: "Sequential FORTRAN; vector statements; early parallel-language proposals"
    decomposition_representation: "None for distribution; dependence graphs and loop-level analysis for vectorization"
    generated_communication: "None (shared or centralised memory)"
    limitation: "No notion of data placement as a compiler problem; machines had a single address space or SIMD broadcast control"
    boundary_evidence: "FORTRAN I (1957); ILLIAC IV (1968 design paper); Lamport hyperplane (1974); CRAY-1 (1978)"
  - id: era1
    name: "Emergence of distributed-memory compilation"
    start: 1980
    end: 1987
    machine_driver: "Multicomputers and hypercubes (Cosmic Cube, iPSC, nCUBE), systolic arrays, Connection Machine"
    programming_abstraction: "Explicit message passing; early global-array proposals; SIMD data-parallel languages"
    decomposition_representation: "Programmer-managed; first compiler proposals for placement"
    generated_communication: "Hand-written sends/receives"
    limitation: "Programming by hand was error-prone; portability across machines was poor"
    boundary_evidence: "Dependence graphs (Kuck et al. 1981); Cosmic Cube (1985); first distributed-memory compilation papers appear 1988"
  - id: era2
    name: "Global arrays and data decomposition"
    start: 1988
    end: 1992
    machine_driver: "Commercial hypercubes and MPPs (iPSC/2, iPSC/860, nCUBE-2, CM-2)"
    programming_abstraction: "Sequential or global-array programs with distribution annotations (SUPERB, Kali, Vienna Fortran, Fortran D)"
    decomposition_representation: "BLOCK/CYCLIC distributions, alignment to templates/decompositions, overlap regions"
    generated_communication: "Compiler-generated point-to-point messages; message vectorization; first inspector-executor runtimes"
    limitation: "Regular, affine programs only; automatic distribution selection intractable in general; communication costs poorly modelled"
    boundary_evidence: "Callahan & Kennedy, SUPERB, Chen/Choo/Li (all 1988); Fortran D and Vienna Fortran papers 1991-92"
  - id: era3
    name: "HPF, MPI, and compiler maturity"
    start: 1993
    end: 2000
    machine_driver: "MPPs (CM-5, Paragon, SP2, T3D/T3E) and early clusters"
    programming_abstraction: "HPF directives; MPI library calls; irregular extensions; early PGAS proposals (Co-array Fortran, Titanium) at the end of the era"
    decomposition_representation: "HPF ALIGN/DISTRIBUTE with BLOCK, CYCLIC(k), templates and processor arrangements; INDIRECT/mapping arrays in HPF-2 and research systems"
    generated_communication: "Communication sets, local address generation, redistribution, collectives; PARTI/CHAOS schedules for irregular code"
    limitation: "HPF compilers were slow to mature and performance was unpredictable; explicit MPI became the dominant practice"
    boundary_evidence: "HPF 1.0 (1993); MPI 1.0 (1994); PARADIGM journal paper (1995); Co-array Fortran and Titanium first published (1998); Benkner/Zima HPF overview (1999)"
  - id: era4
    name: "MPI dominance and alternative programming models"
    start: 2000
    end: 2010
    machine_driver: "Commodity clusters, early multicore nodes, Cell/BE and explicitly managed memories"
    programming_abstraction: "MPI(+OpenMP); PGAS (UPC, Co-array Fortran, Titanium); HPCS languages (Chapel, X10); hierarchical memory models (Sequoia)"
    decomposition_representation: "Language-level distributions and locales/places; hierarchical task trees"
    generated_communication: "One-sided communication, compiler-scheduled bulk transfers for memory hierarchies"
    limitation: "Adoption of new languages remained limited; automatic distribution rarely used in production"
    boundary_evidence: "UPC/Titanium compilers; X10 (2005); Sequoia (2006); Chapel (2007); Pluto (2008)"
  - id: era5
    name: "Compiler/runtime co-design and accelerators"
    start: 2010
    end: 2019
    machine_driver: "GPU clusters, heterogeneous nodes, early TPU pods"
    programming_abstraction: "Affine loop nests; task/region programs (Legion, Regent); tensor DSLs; ML graph frameworks"
    decomposition_representation: "Polyhedral partitions; logical regions and partitions; named-dimension layouts (Mesh-TensorFlow)"
    generated_communication: "Polyhedral communication-set generation with MPI; dynamic region coherence; collectives in ML frameworks"
    limitation: "Each system covered one domain; no shared ownership IR; ML partitioning still largely manual"
    boundary_evidence: "Bondhugula distributed polyhedral codegen (2011/2013); Legion (2012); Molly (2014); Mesh-TensorFlow (2018); FlexFlow/PipeDream/Megatron (2019)"
  - id: era6
    name: "Mesh sharding, ML systems, and spatial accelerators"
    start: 2020
    end: 2026
    machine_driver: "TPU/GPU pods, AI accelerators, wafer-scale engines, spatial dataflow chips"
    programming_abstraction: "Sharding annotations on device meshes; tensor algebra with distribution formats; MLIR dialects; stencil DSLs"
    decomposition_representation: "Device meshes with per-dimension sharding; distributed tensor formats; MLIR shard/mesh attributes"
    generated_communication: "Collective insertion by propagation; resharding; automated search over parallelism plans"
    limitation: "Dynamic/irregular workloads, heterogeneous hierarchies, and memory-capacity constraints remain weakly handled; fragmentation across frameworks"
    boundary_evidence: "GSPMD (2021); Alpa and DISTAL/SpDISTAL (2022); PartIR and Shardy (2024-25); MLIR distributed sparse tensors (2025)"
