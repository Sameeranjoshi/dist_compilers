  summary: Su's 2010 Berkeley dissertation adds inspector-executor transfers for remote indirect reads and update-by-owner
    for synchronized writes to the Titanium PGAS compiler, evaluated on clusters against an MPI library and against
    unoptimized code. It also reports multicore update-strategy tradeoffs in C code and a trace-based tool that
    finds communication-count bugs at scale.
  why_read: It gives a detailed account of how a PGAS compiler turns irregular reads and writes into scheduled or
    aggregated communication, with measured cluster results.
