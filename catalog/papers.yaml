  summary: The paper presents a design for user-defined data distributions as first-class objects in Chapel, built
    from domains, index sets, a global mapping from indices to locales and an optional locale-internal layout. It
    illustrates the design with cyclic and block classes and a sparse case, and states that the implementation is
    underway, with no performance results yet.
  why_read: It shows how a high-level parallel language can let programmers write distribution policies as ordinary
    code while the compiler generates the local and remote accesses.
