  summary: Chatterjee et al. show that a processor's local memory access sequence for a regular section under a
    cyclic(k) distribution with affine alignment is produced by a finite state machine with at most k states. They
    give table-construction algorithms, extend the method to multidimensional arrays, and reuse the same tables
    to generate shift and stride-change communication sets.
  why_read: It explains how HPF-style local addressing and message sets reduce to small per-processor tables, which
    is a core problem for any data-parallel compiler.
