  summary: This overview describes how HPF compilers for distributed-memory machines are built, covering distribution
    and alignment processing, local index sets, owner-computes translation of regular array statements, and the
    inspector/executor scheme for irregular independent loops. It closes with the authors' view that some HPF features,
    such as block-cyclic alignment with non-unit strides, are hard to implement efficiently and that the language
    needs further development.
  why_read: It is a compact overview of HPF compilation and runtime techniques, from layout descriptors to reuse
    of communication schedules for irregular loops.
