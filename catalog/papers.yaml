  summary: 'This report adds distributed-memory communication generation to the Pluto polyhedral toolchain: per
    tile it computes dependence-based flow-out and write-out sets, packs them into buffers, and either broadcasts
    them with MPI collectives or uses compiler-generated pi/sigma helper functions evaluated at run time to send
    only to the ranks that need the data, with code parametric in problem size and process count. On a 32-node InfiniBand
    cluster the report shows 10-26x speedups over the single-process version and better results than hand-written
    MPI and pghpf on stencils.'
  why_read: Learn the flow-out/write-out set formulation of communication from exact dependences and how symbolic
    process counts are handled by generating runtime helper functions rather than virtual processors.
