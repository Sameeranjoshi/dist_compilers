  summary: 'This survey distills a series of workshops on data-locality abstractions into a layered view of libraries,
    languages, runtimes and system-scale tools. Its distributed-memory content is qualitative: it classifies libraries
    by scale and languages by local-versus-global object visibility, and it calls for common abstractions across
    these layers.'
