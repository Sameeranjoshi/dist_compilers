  summary: Kali (KF1 syntax) gives Fortran programs a global name space over distributed arrays while requiring
    the programmer to declare a processor array, per-array distributions (block, cyclic, block_cyclic, user-defined
    map functions, dynamic distribute) and doall loops with an on clause that names the executing processor. The
    compiler strip-mines doall loops by the on clause and derives in/out communication sets either symbolically
    at compile time or, for data-dependent subscripts, with a run-time inspector whose results are cached and reused
    by the executor across repeated loop executions.
  why_read: Learn the original inspector/executor idea for irregular loops together with the on-clause/owner() way
    of binding loop iterations to processors.
