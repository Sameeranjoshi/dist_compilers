  summary: 'Extends PARTI with two runtime-compilation methods for unstructured codes: incremental communication
    schedules (flocalize/fmlocalize with hash-based duplicate removal, dfmgather and scatter-add) that fetch each
    off-processor datum once across several loops, and a ''mapper coupler'' that generates a runtime dependence
    graph and iteration graph from user-designated loops so that any graph partitioner can produce distributed translation
    tables and iteration assignments. On an iPSC/860 the report says incremental schedules cut per-iteration communication
    of a 3-D unstructured Euler solver by roughly 40%, and that most compiler transformations were not yet implemented
    (the primitives were embedded by hand).'
  why_read: It defines the PARTI primitive set (translation tables, schedules, gather/scatter/accumulate, buffer-after-owned-data
    layout) in enough detail to understand how later irregular-application compilers treat communication as reusable
    schedule objects.
