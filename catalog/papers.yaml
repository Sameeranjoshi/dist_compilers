  summary: 'Describes Digital''s DEC Fortran 90 compiler for HPF 1.1 targeting Alpha workstation farms and SMPs
    via the Parallel Software Environment: a ''transform'' component (LOWER, DATA, ITER, ARG, DIVIDE, STRIP) builds
    data spaces and iteration spaces, makes communication explicit as assignments between regions, and emits explicit-SPMD
    code with inlined local addressing and SEND/RECEIVE calls without barriers. Communication optimisations include
    message vectorisation, compiler-recognised shadow edges for nearest-neighbour stencils, inlined logarithmic
    reductions, one-time address preprocessing for loop-invariant irregular accesses, and fast paths for contiguous
    or single-partner transfers; the article reports 8-17x speedups on eight processors.'
  why_read: It is a concise, production-oriented description of how a commercial HPF compiler represents distributions
    and iteration spaces and derives static communication for block/cyclic data, including why strict owner-computes
    was not adopted.
