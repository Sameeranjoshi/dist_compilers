  summary: FlexFlow defines the SOAP space (Sample, Operation, Attribute, Parameter) in which each operation's output
    tensor is partitioned into equal blocks assigned to devices, and searches it with Metropolis-Hastings MCMC guided
    by a task-graph execution simulator that profiles each operator once and re-simulates incrementally. On six
    DNNs and two GPU clusters up to 64 GPUs the paper reports up to 3.3x over data-parallel and expert strategies
    and 3.4-3.8x over REINFORCE placements, with search in seconds to minutes.
