  summary: Rogers and Pingali compile a sequential Id-like program together with a data decomposition into per-process
    C code for the Intel iPSC/2, using run-time resolution as a correct fallback and compile-time resolution where
    ownership can be analyzed. Vectorization, pipelining and accumulation of messages are added, and the Gauss-Seidel
    measurements show the best variant at about three quarters of the speed of handwritten code, while SIMPLE speeds
    up to 32 processors.
  why_read: It is a clear early account of owner-driven process decomposition with a correct fallback, and of the
    message optimizations needed to make such generated code usable.
