  summary: This invited survey reviews how Fortran programs with user-specified data distributions can be compiled
    into SPMD message-passing code for distributed-memory machines. It presents a four-phase translation strategy,
    overlap-based and aggregate communication optimizations, and inspector-executor techniques for irregular accesses,
    and then surveys the systems that implement them.
  why_read: It is a compact early account of how distribution-based compilers turn a global-address Fortran program
    into message-passing code.
