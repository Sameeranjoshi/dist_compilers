[project]
name = "dist-compilers-survey"
version = "0.1.0"
description = "Evidence base, catalog, figures and manuscript for a historical survey and taxonomy of distributed-memory compilers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sameeran Joshi"}]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.18",
  "matplotlib>=3.7",
  "graphviz>=0.20",
  "requests>=2.31",
]

[project.urls]
Repository = "https://github.com/Sameeranjoshi/dist_compilers"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
